version: 2

models:
  - name: stg_dim_date
    description: "Cleansed staging view of DimDate."
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: stg_dim_region
    description: "Cleansed staging view of DimRegion."
    columns:
      - name: region_key
        tests: [unique, not_null]
      - name: region_code
        tests: [unique, not_null]

  - name: stg_dim_warehouse
    description: "Cleansed staging view of DimWarehouse."
    columns:
      - name: warehouse_key
        tests: [unique, not_null]
      - name: warehouse_code
        tests: [unique, not_null]

  - name: stg_dim_supplier
    description: "Cleansed staging view of DimSupplier."
    columns:
      - name: supplier_key
        tests: [unique, not_null]
      - name: supplier_code
        tests: [unique, not_null]

  - name: stg_dim_product
    description: "Cleansed staging view of DimProduct."
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_sku
        tests: [not_null]

  - name: stg_dim_customer_channel
    description: "Cleansed staging view of DimCustomerChannel."
    columns:
      - name: customer_channel_key
        tests: [unique, not_null]

  - name: stg_dim_employee_planner
    description: "Cleansed staging view of DimEmployeePlanner."
    columns:
      - name: planner_key
        tests: [unique, not_null]

  - name: stg_dim_scenario
    description: "Cleansed staging view of DimScenario."
    columns:
      - name: scenario_key
        tests: [unique, not_null]

  - name: stg_bridge_product_supplier
    description: "Cleansed staging view of BridgeProductSupplier."
    columns:
      - name: bridge_key
        tests: [unique, not_null]

  - name: stg_fact_sales
    description: "Cleansed staging view of FactSales."
    columns:
      - name: sales_line_key
        tests: [unique, not_null]
      - name: order_date_key
        tests: [not_null]

  - name: stg_fact_inventory_snapshot
    description: "Cleansed staging view of FactInventorySnapshot."
    columns:
      - name: snapshot_key
        tests: [unique, not_null]
      - name: snapshot_date_key
        tests: [not_null]

  - name: stg_fact_purchase_order
    description: "Cleansed staging view of FactPurchaseOrder."
    columns:
      - name: po_line_key
        tests: [unique, not_null]
      - name: po_creation_date_key
        tests: [not_null]

  - name: stg_fact_demand_forecast
    description: "Cleansed staging view of FactDemandForecast."
    columns:
      - name: forecast_key
        tests: [unique, not_null]

  - name: stg_fact_inventory_movement
    description: "Cleansed staging view of FactInventoryMovement."
    columns:
      - name: movement_key
        tests: [unique, not_null]

  - name: stg_fact_stockout
    description: "Cleansed staging view of FactStockout."
    columns:
      - name: stockout_event_key
        tests: [unique, not_null]

  - name: stg_fact_customer_returns
    description: "Cleansed staging view of FactCustomerReturns."
    columns:
      - name: return_line_key
        tests: [unique, not_null]
