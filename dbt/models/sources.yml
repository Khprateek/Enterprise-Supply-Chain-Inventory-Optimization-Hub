version: 2

sources:
  - name: raw_supply_chain
    description: "Raw landing zone tables ingested directly from validated source Parquet files."
    database: "{{ env_var('GCP_PROJECT_ID', 'smart-supply-and-inventory') }}"
    schema: "{{ env_var('GCP_RAW_SCHEMA', 'raw_supply_chain') }}"
    tables:
      - name: raw_dim_date
        description: "Static calendar reference dimension table."
        columns:
          - name: DateKey
            tests: [unique, not_null]
          - name: FullDate
            tests: [unique, not_null]

      - name: raw_dim_region
        description: "Geographic operational regions."
        columns:
          - name: RegionKey
            tests: [unique, not_null]

      - name: raw_dim_warehouse
        description: "Distribution center and fulfillment warehouse master."
        columns:
          - name: WarehouseKey
            tests: [unique, not_null]

      - name: raw_dim_supplier
        description: "Supplier vendor profile and SLA parameters."
        columns:
          - name: SupplierKey
            tests: [unique, not_null]

      - name: raw_dim_product
        description: "Product catalog master with cost and handling attributes."
        columns:
          - name: ProductKey
            tests: [unique, not_null]
          - name: ProductSKU
            tests: [not_null]

      - name: raw_dim_customer_channel
        description: "Customer demand channels and wholesale accounts."
        columns:
          - name: CustomerChannelKey
            tests: [unique, not_null]

      - name: raw_dim_employee_planner
        description: "Supply chain planners and operational controllers."
        columns:
          - name: PlannerKey
            tests: [unique, not_null]

      - name: raw_dim_scenario
        description: "What-if simulation parameters."
        columns:
          - name: ScenarioKey
            tests: [unique, not_null]

      - name: raw_bridge_product_supplier
        description: "Many-to-many sourcing authorization matrix between products and vendors."

      - name: raw_fact_sales
        description: "Transactional customer sales orders lines."
        columns:
          - name: SalesLineKey
            tests: [unique, not_null]
          - name: OrderDateKey
            tests: [not_null]
          - name: ProductKey
            tests: [not_null]

      - name: raw_fact_inventory_snapshot
        description: "Daily periodic inventory snapshot balances."
        columns:
          - name: SnapshotKey
            tests: [unique, not_null]
          - name: SnapshotDateKey
            tests: [not_null]
          - name: ProductKey
            tests: [not_null]
          - name: WarehouseKey
            tests: [not_null]

      - name: raw_fact_purchase_order
        description: "Replenishment purchase order lines and inbound receiving milestones."
        columns:
          - name: POLineKey
            tests: [unique, not_null]
          - name: POCreationDateKey
            tests: [not_null]
          - name: SupplierKey
            tests: [not_null]

      - name: raw_fact_demand_forecast
        description: "Periodic demand forecasts by SKU, warehouse, and scenario."
        columns:
          - name: ForecastKey
            tests: [unique, not_null]

      - name: raw_fact_inventory_movement
        description: "Warehouse transfers, adjustments, and write-offs."
        columns:
          - name: MovementKey
            tests: [unique, not_null]

      - name: raw_fact_stockout
        description: "Consolidated stockout outage episodes."
        columns:
          - name: StockoutEventKey
            tests: [unique, not_null]

      - name: raw_fact_customer_returns
        description: "Customer product returns and reverse logistics dispositions."
        columns:
          - name: ReturnLineKey
            tests: [unique, not_null]
