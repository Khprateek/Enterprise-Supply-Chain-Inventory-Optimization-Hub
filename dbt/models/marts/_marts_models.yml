version: 2

models:
  - name: dim_date
    description: "Conformed static calendar dimension with 4-year calendar coverage and fiscal hierarchies."
    columns:
      - name: date_key
        description: "Primary key in YYYYMMDD format."
        tests: [unique, not_null]
      - name: full_date
        description: "Standard Gregorian date."
        tests: [unique, not_null]

  - name: dim_region
    description: "Operational geographic sales and distribution territories."
    columns:
      - name: region_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: region_code
        tests: [unique, not_null]

  - name: dim_warehouse
    description: "Distribution center and fulfillment warehouse master."
    columns:
      - name: warehouse_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: region_key
        description: "Foreign key to DimRegion."
        tests:
          - not_null
          - relationships:
              to: ref('dim_region')
              field: region_key

  - name: dim_supplier
    description: "Direct supplier profile with contract lead times and risk ratings."
    columns:
      - name: supplier_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: supplier_code
        tests: [unique, not_null]

  - name: dim_product
    description: "Conformed product dimension tracking catalog attributes, standard costs, and classifications."
    columns:
      - name: product_key
        description: "Surrogate primary key representing SKU revision version."
        tests: [unique, not_null]
      - name: product_sku
        description: "Natural business key."
        tests: [not_null]
      - name: primary_supplier_key
        tests:
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key

  - name: dim_customer_channel
    description: "Sales demand channels and enterprise accounts."
    columns:
      - name: customer_channel_key
        description: "Surrogate primary key."
        tests: [unique, not_null]

  - name: dim_employee_planner
    description: "Supply chain planners and facility controllers."
    columns:
      - name: planner_key
        description: "Surrogate primary key."
        tests: [unique, not_null]

  - name: dim_scenario
    description: "Simulation parameter presets for what-if sensitivity analysis."
    columns:
      - name: scenario_key
        description: "Surrogate primary key."
        tests: [unique, not_null]

  - name: bridge_product_supplier
    description: "Many-to-many sourcing authorization bridge between products and vendors."
    columns:
      - name: bridge_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: supplier_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key

  - name: fact_sales
    description: "Transactional customer order lines."
    columns:
      - name: sales_line_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: warehouse_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_warehouse')
              field: warehouse_key
      - name: customer_channel_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer_channel')
              field: customer_channel_key

  - name: fact_inventory_snapshot
    description: "Daily periodic snapshot of on-hand, available, and reserved stock."
    columns:
      - name: snapshot_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: snapshot_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: warehouse_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_warehouse')
              field: warehouse_key

  - name: fact_purchase_order
    description: "Procurement purchase order lines and inbound receiving milestones."
    columns:
      - name: po_line_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: po_creation_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: supplier_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: receiving_warehouse_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_warehouse')
              field: warehouse_key
      - name: delay_root_cause_category
        description: >
          Operational classification of the primary cause of delivery delay for each
          completed purchase order line. Derived in the mart layer by joining to
          DimSupplier (region_zone, supplier_tier) and evaluating lead_time_variance_days.
          Used as the axis field for the Root Cause breakdown bar chart on Page 4.
          Priority evaluation order: Overseas customs congestion > Tier 3 material
          shortage > Carrier/freight inefficiency > Other late > On Time or Early.
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Customs & Port Congestion (Overseas)'
                - 'Raw Material Shortage (Tier 3)'
                - 'Carrier Capacity & Freight Inefficiency'
                - 'Other Late Delivery'
                - 'On Time or Early'

  - name: fact_demand_forecast
    description: "Demand forecasts across simulation scenarios."
    columns:
      - name: forecast_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: target_period_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: scenario_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_scenario')
              field: scenario_key

  - name: fact_inventory_movement
    description: "Inter-DC inventory transfers, write-offs, and scrap transactions."
    columns:
      - name: movement_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: movement_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

  - name: fact_stockout
    description: "Consolidated stockout outage episodes."
    columns:
      - name: stockout_event_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: start_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

  - name: fact_customer_returns
    description: "Customer product returns and reverse logistics dispositions."
    columns:
      - name: return_line_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: return_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

  - name: fact_supplier_monthly_performance
    description: "Materialized monthly vendor scorecard mart computing OTIF and fill rate."
    columns:
      - name: supplier_monthly_key
        description: "Surrogate primary key."
        tests: [unique, not_null]
      - name: year_month_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: supplier_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key
