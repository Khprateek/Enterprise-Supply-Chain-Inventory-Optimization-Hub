# ─────────────────────────────────────────────────────────────────────────────
# Google Cloud Dataproc Cluster Definition
# Enterprise Supply Chain & Inventory Optimization Hub
# ─────────────────────────────────────────────────────────────────────────────
#
# This YAML is used by the 'scripts/create_dataproc_cluster.py' helper and
# can also be submitted directly with:
#
#   gcloud dataproc clusters create <CLUSTER_NAME> \
#       --properties-file conf/gcp/dataproc_cluster.yaml \
#       --region <REGION>
#
# ─────────────────────────────────────────────────────────────────────────────

cluster_name: sc-hub-spark-cluster
region: us-central1                         # Match your BigQuery dataset location
zone: us-central1-a

# ── Project & Network ────────────────────────────────────────────────────────
project_id: supply-chain-analytics-hub      # Replace with GCP project ID
network: default                            # VPC network (use 'default' to start)
subnetwork: ""                              # Leave blank for default subnetwork

# ── Cluster Image ────────────────────────────────────────────────────────────
# Dataproc image 2.1 includes Spark 3.4 and Python 3.10
image_version: "2.1-debian11"

# ── Master Node ──────────────────────────────────────────────────────────────
master:
  machine_type: n2-standard-4              # 4 vCPUs, 16 GB RAM
  disk:
    type: pd-ssd
    size_gb: 100
  num_instances: 1

# ── Worker Nodes ─────────────────────────────────────────────────────────────
# 3 × n2-standard-4 = 12 total vCPUs, 48 GB total RAM across cluster
# Handles datasets up to ~100M rows comfortably
workers:
  machine_type: n2-standard-4              # 4 vCPUs, 16 GB RAM each
  disk:
    type: pd-ssd
    size_gb: 200                           # Large disks for shuffle spill
  num_instances: 3                         # Scale to 5-10 for production loads

# ── Optional: Preemptible (Spot) Workers ─────────────────────────────────────
# Preemptible workers cut compute costs ~70% — good for dev/test
secondary_workers:
  machine_type: n2-standard-4
  preemptibility: PREEMPTIBLE
  num_instances: 0                         # Set to 2-4 for cost savings in dev

# ── Software Configuration ───────────────────────────────────────────────────
software_config:
  properties:
    # ── Spark tuning ─────────────────────────────────────────────────────────
    "spark:spark.executor.cores": "4"
    "spark:spark.executor.memory": "12g"
    "spark:spark.executor.memoryOverhead": "2g"
    "spark:spark.driver.memory": "4g"
    "spark:spark.sql.shuffle.partitions": "36"
    "spark:spark.sql.adaptive.enabled": "true"
    "spark:spark.sql.adaptive.skewJoin.enabled": "true"

    # ── BigQuery connector (connector is pre-installed on Dataproc 2.1) ──────
    "spark:spark.bigquery.read.format": "arrow"
    "spark:spark.bigquery.write.method": "indirect"

    # ── Logging ──────────────────────────────────────────────────────────────
    "spark:spark.eventLog.enabled": "true"
    "spark:spark.eventLog.dir": "gs://sc-analytics-spark-temp/spark-event-logs"

  # Python 3 is the default on Dataproc 2.1
  optional_components:
    - JUPYTER                              # Remove don't need notebooks on cluster

# ── Initialization Actions ───────────────────────────────────────────────────
# Run after cluster creation to install Python dependencies
initialization_actions:
  - executable_file: "gs://sc-analytics-spark-temp/init/install_python_deps.sh"
    execution_timeout: "300s"

# ── Labels ───────────────────────────────────────────────────────────────────
labels:
  project: enterprise-supply-chain-hub
  env: dev
  team: supply-chain-analytics
  cost-center: data-engineering

# ── Auto-delete (save cost during development) ───────────────────────────────
lifecycle_config:
  idle_delete_ttl: "3600s"                 # Auto-delete cluster after 1hr idle
  auto_delete_ttl: ""                      # Leave blank to keep running indefinitely
